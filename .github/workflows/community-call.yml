name: Community Call Reminder

on:
  schedule:
    # Every Monday at 02:00 UTC = exactly 24 hours before Tuesday 10:00 HKT (02:00 UTC)
    - cron: '0 2 * * 1'
  workflow_dispatch: # Manual trigger for testing

jobs:
  post-reminder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Collect agenda from open PRs and ready issues
        id: agenda
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fmt='"- [#\(.number)](\(.url)) \(.title) (by @\(.author.login))"'
          PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title,url,author,statusCheckRollup)
          # A PR is green when it has checks and every check concluded successfully (or was skipped).
          green='(.statusCheckRollup | length > 0) and all(.statusCheckRollup[]; (.conclusion // .state) as $c | $c == "SUCCESS" or $c == "SKIPPED" or $c == "NEUTRAL")'
          GREEN=$(echo "$PRS" | jq -r ".[] | select($green) | $fmt")
          WORK=$(echo "$PRS" | jq -r ".[] | select(($green) | not) | $fmt")
          READY=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label Good \
            --search "-linked:pr" --limit 100 --json number,title,url,author --jq ".[] | $fmt")

          section() {
            if [ -n "$2" ]; then
              echo "**$1:**"
              echo "$2"
              echo ""
            fi
          }

          {
            echo 'AGENDA<<EOF'
            section "PRs ready for maintainer review (CI green)" "$GREEN"
            section "PRs needing work" "$WORK"
            section "Ready issues without a PR" "$READY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Collect closed issues from last week
        id: closed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          ITEMS=$(gh issue list --repo "$GITHUB_REPOSITORY" --state closed \
            --search "closed:>=$SINCE" --json number,title,url,author \
            --jq '.[] | "- [#\(.number)](\(.url)) \(.title) (by @\(.author.login))"')

          {
            echo 'CLOSED<<EOF'
            if [ -n "$ITEMS" ]; then
              echo "**Closed this week:**"
              echo "$ITEMS"
              echo ""
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post to Zulip
        env:
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_BOT_API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
        run: |
          TOMORROW=$(TZ=Asia/Hong_Kong date -d '+1 day' +%Y-%m-%d)
          CALL_TIME="10:00 HKT (UTC+8)"

          TOPIC="Community Call ${TOMORROW}"

          BODY="**Community Call — ${TOMORROW} at ${CALL_TIME}**

          **Join:** ${{ secrets.CALL_LINK }}

          **Latest documentation:** [reductions.pdf](https://codingthrust.github.io/problem-reductions/reductions.pdf)

          ## Agenda
          ${{ steps.closed.outputs.CLOSED }}
          ${{ steps.agenda.outputs.AGENDA }}
          **Open discussion** — bring your questions and ideas!

          ---
          _Reply to this thread to add agenda items._"

          # Post via Zulip API
          curl -s -X POST "https://problem-reductions.zulipchat.com/api/v1/messages" \
            -u "${ZULIP_BOT_EMAIL}:${ZULIP_BOT_API_KEY}" \
            --data-urlencode "type=stream" \
            --data-urlencode "to=community-call" \
            --data-urlencode "topic=${TOPIC}" \
            --data-urlencode "content=${BODY}"
