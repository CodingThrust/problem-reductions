name: Deploy Documentation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read Open Question Board source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GiggleLiu/autoresearch-gadgets
          ref: 9ceb0e4c3a4a72b536f8d3d478f9296c546a7bf8
          path: open-questions-source
          token: ${{ secrets.PROJECT_READ_TOKEN }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build Open Question Board
        run: uv run --project open-questions-source/website --locked python open-questions-source/website/build.py

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.0'
          targets: wasm32-unknown-unknown

      - name: Install browser binding tools
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/bin"
          curl -fLsS https://github.com/rust-lang/mdBook/releases/download/v0.5.2/mdbook-v0.5.2-x86_64-unknown-linux-gnu.tar.gz -o mdbook.tar.gz
          echo '084e4342ba564db270108763e404a7d1f309d932651a22484e93c0dc1a071f6d  mdbook.tar.gz' | sha256sum --check
          tar -xzf mdbook.tar.gz -C "$HOME/bin"
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Install Typst
        run: |
          curl -fLsS https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz -o typst.tar.xz
          echo 'a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  typst.tar.xz' | sha256sum --check
          tar -xJf typst.tar.xz
          mv typst-x86_64-unknown-linux-musl/typst "$HOME/bin/"

      - name: Build and verify deployment artifact
        run: |
          uv run --python 3.12.14 --no-project --with-requirements scripts/website-requirements.txt python -m playwright install --with-deps chromium firefox webkit
          uv run --python 3.12.14 --no-project --with-requirements scripts/website-requirements.txt python scripts/check_website.py --output book --open-questions open-questions-source/website/dist --require-open-questions
          npm audit --audit-level=moderate
          git diff --exit-code -- Cargo.lock package-lock.json

      - name: Retain verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-verification
          path: |
            book/verification.json
            book/verification.log

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: './book'

  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
