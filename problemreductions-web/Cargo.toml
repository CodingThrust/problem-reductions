[package]
name = "problemreductions-web"
version = "0.6.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
problemreductions-expr = { path = "../problemreductions-expr" }
num-bigint = "0.4.8"
num-rational = "0.4.2"
num-traits = "0.2.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
wasm-bindgen = "=0.2.129"

[dev-dependencies]
proptest = "1.11.0"
