<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b110d">
  <meta name="color-scheme" content="dark">
  <title>Reduction Paths — Problem Reductions</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/path-selection_bg.wasm.gz" as="fetch" type="application/gzip" crossorigin>
  <link rel="stylesheet" href="./assets/site.css">
  <link rel="stylesheet" href="./assets/details.css">
  <link rel="stylesheet" href="./assets/graph.css">
  <script type="module" src="./assets/graph-startup.ts"></script>
  <script type="module" src="./assets/graph-scene.js"></script>
  <script type="module" src="./assets/details.js"></script>
  <script type="module" src="./assets/graph.js"></script>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="wordmark" href="./index.html#home" aria-label="Problem Reductions home"><img class="project-logo" src="./assets/logo.svg" alt="100 Problem-Reductions" width="372" height="107"></a>
    <nav aria-label="Main navigation">
      <a href="./index.html#home">Home</a>
      <a href="./graph.html" aria-current="page">Graph</a>
      <a href="./index.html#atlas">Atlas</a>
      <a href="./index.html#infrastructure">Get started</a>
      <a href="./introduction.html" class="docs-nav">Docs <span aria-hidden="true">↗</span></a>
      <a href="./open-questions/">Open questions <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>
<main id="canvas" aria-label="Reduction graph"><div id="cy"></div></main>

<section class="panel" aria-label="Reduction paths">
  <header class="panel-head"><h1 class="brand"><a href="./index.html">Reduction paths</a></h1></header>
  <div class="ends" id="ends">
    <div class="end from">
      <span class="pin" aria-hidden="true"></span>
      <div><input id="source" placeholder="Start problem" autocomplete="off" spellcheck="false" aria-label="Start problem" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest"><div class="options" id="source-options" hidden></div></div>
    </div>
    <div class="end to">
      <span class="pin" aria-hidden="true"></span>
      <div><input id="target" placeholder="End problem" autocomplete="off" spellcheck="false" aria-label="End problem" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest"><div class="options" id="target-options" hidden></div></div>
    </div>
    <button class="swap" id="swap" aria-label="Swap start and end"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5v11M2.5 5 5 2.5 7.5 5M11 13.5v-11M8.5 11l2.5 2.5 2.5-2.5"/></svg></button>
    <div class="suggest" id="suggest" role="listbox" aria-label="Problems" hidden></div>
  </div>
  <div id="search-status" class="sr-only" role="status"></div>
  <div class="results" id="results" aria-live="polite"></div>
</section>

<div class="pop" id="pop" role="dialog" aria-labelledby="pop-title" hidden></div>
<nav class="dock" aria-label="Graph navigation">
  <button id="zoom-in" aria-label="Zoom in"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 2v10M2 7h10"/></svg></button>
  <button id="zoom-out" aria-label="Zoom out"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 7h10"/></svg></button>
  <button id="fit" aria-label="Show whole graph"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 5V1.5H5M9 1.5h3.5V5M12.5 9v3.5H9M5 12.5H1.5V9"/></svg></button>
  <button id="pan-left" aria-label="Pan graph left">←</button>
  <button id="pan-up" aria-label="Pan graph up">↑</button>
  <button id="pan-right" aria-label="Pan graph right">→</button>
  <button id="pan-down" aria-label="Pan graph down">↓</button>
</nav>

<div id="details-drawer" role="dialog" aria-labelledby="details-title" hidden>
  <div class="drawer-head">
    <div><h2 id="details-title"></h2><a id="drawer-atlas">Open in Atlas ↗</a></div>
    <button id="close-details" type="button" aria-label="Close details">×</button>
  </div>
  <div id="drawer-body" class="graph-detail"></div>
</div>
</body>
</html>
