<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b110d">
  <meta name="color-scheme" content="dark">
  <title>Reduction Paths — Problem Reductions</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/graph-scene.json.gz" as="fetch" type="application/gzip" crossorigin>
  <link rel="preload" href="./assets/path-graph.json.gz" as="fetch" type="application/gzip" crossorigin>
  <link rel="preload" href="./assets/path-selection_bg.wasm.gz" as="fetch" type="application/gzip" crossorigin>
  <link rel="preload" href="./assets/fonts/dm-sans-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./src/styles/site.css">
  <link rel="stylesheet" href="./src/styles/details.css">
  <link rel="stylesheet" href="./src/styles/graph.css">
  <script type="module" src="./src/pages/graph-startup.ts"></script>
  <script type="module" src="./src/pages/graph.ts"></script>
</head>
<body data-scene="./assets/graph-scene.json.gz">
<header class="site-header">
  <div class="header-inner">
    <a class="wordmark" href="./index.html#home" aria-label="Problem Reductions home"><img class="project-logo" src="./assets/logo.svg" alt="100 Problem-Reductions" width="372" height="107"></a>
    <nav aria-label="Main navigation">
      <a href="./index.html#home">Home</a>
      <a href="./graph.html" aria-current="page">Graph</a>
      <a href="./index.html#atlas">Atlas</a>
      <a href="./index.html#infrastructure">Get started</a>
      <a href="./introduction.html" class="docs-nav">Docs <i class="arrow ne" aria-hidden="true"></i></a>
      <a href="./open-questions/">Open questions <i class="arrow ne" aria-hidden="true"></i></a>
    </nav>
  </div>
</header>
<main id="canvas" aria-label="Reduction graph"><div id="cy"></div></main>

<section class="panel" aria-label="Reduction graph">
  <div id="view-explore" class="view">
    <header class="panel-head"><h1 class="brand"><a href="./index.html">Reduction graph</a></h1></header>
    <div class="search-row">
      <label class="searchbox"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input id="find" type="search" placeholder="Search problems and rules" autocomplete="off" spellcheck="false" aria-label="Search problems and rules"></label>
      <button id="go-directions" class="dir-btn" type="button" aria-label="Directions" title="Directions"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 1.8 16.2 9 9 16.2 1.8 9Z"/><path d="M6 10V8.4a1 1 0 0 1 1-1h4.6M10.2 5.9l1.6 1.5-1.6 1.5"/></svg></button>
    </div>
    <div class="explore-body" id="explore-body"></div>
  </div>
  <div id="view-directions" class="view" hidden>
    <header class="panel-head dir-head"><button id="back-explore" class="back-btn" type="button" aria-label="Back to explore"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button><h1 class="brand">Directions</h1></header>
    <div class="ends" id="ends">
      <div class="end from">
        <span class="pin" aria-hidden="true"></span>
        <div><input id="source" placeholder="Start problem" autocomplete="off" spellcheck="false" aria-label="Start problem" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest"><div class="options" id="source-options" hidden></div></div>
      </div>
      <div class="end to">
        <span class="pin" aria-hidden="true"></span>
        <div><input id="target" placeholder="End problem" autocomplete="off" spellcheck="false" aria-label="End problem" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest"><div class="options" id="target-options" hidden></div></div>
      </div>
      <button class="swap" id="swap" aria-label="Swap start and end"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5v11M2.5 5 5 2.5 7.5 5M11 13.5v-11M8.5 11l2.5 2.5 2.5-2.5"/></svg></button>
      <div class="suggest" id="suggest" role="listbox" aria-label="Problems" hidden></div>
    </div>
    <div id="search-status" class="sr-only" role="status"></div>
    <div class="results" id="results" aria-live="polite"></div>
  </div>
</section>

<div class="mapbar" id="mapbar">
  <div class="seg" role="radiogroup" aria-label="Layout" id="layout-seg"></div>
  <div class="seg" role="radiogroup" aria-label="Rule scope" id="scope-seg"></div>
</div>
<div class="growth-legend" id="growth-legend" role="radiogroup" aria-label="Show reductions up to this growth"></div>

<div class="pop" id="pop" role="dialog" aria-labelledby="pop-title" hidden></div>
<nav class="dock" aria-label="Graph navigation">
  <button id="zoom-in" aria-label="Zoom in"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 2v10M2 7h10"/></svg></button>
  <button id="zoom-out" aria-label="Zoom out"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 7h10"/></svg></button>
  <button id="fit" aria-label="Show whole graph"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 5V1.5H5M9 1.5h3.5V5M12.5 9v3.5H9M5 12.5H1.5V9"/></svg></button>
</nav>

<div id="details-drawer" role="dialog" aria-labelledby="details-title" hidden>
  <div class="drawer-head">
    <div><h2 id="details-title"></h2><a id="drawer-atlas">Open in Atlas <i class="arrow ne" aria-hidden="true"></i></a></div>
    <button id="close-details" type="button" aria-label="Close details">×</button>
  </div>
  <div id="drawer-body" class="graph-detail"></div>
</div>
</body>
</html>
