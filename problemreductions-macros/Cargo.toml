[package]
name = "problemreductions-macros"
version = "0.6.0"
edition = "2021"
description = "Procedural macros for problemreductions"
license = "MIT"
repository = "https://github.com/CodingThrust/problem-reductions"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0.6", features = ["full", "parsing"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
problemreductions-expr = { version = "0.6.0", path = "../problemreductions-expr" }
num-traits = "0.2.19"
